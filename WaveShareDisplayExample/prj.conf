CONFIG_POSIX_API=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SPI=y
#CONFIG_UART_ASYNC_API=y
CONFIG_GPIO=y
CONFIG_PRINTK=y

#power management

# LVGL - minimal build, only the label widget enabled
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_CONF_MINIMAL=y 
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_Z_MEM_POOL_SIZE=24000
# Render the whole 300x400 screen in a single buffer/flush instead of
# chunking into multiple VDB-sized bands (the default 10%). Bands
# beyond the first have been observed to get the wrong, byte-rounded
# width from LVGL's chunk-splitting path even though the equivalent
# single-region write is correct - going single-shot sidesteps that
# entirely. 300*400/8 + 8 = 15008 bytes; MEM_POOL_SIZE bumped above to
# fit it plus headroom for other LVGL allocations.
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_MAIN_STACK_SIZE=4096
#CONFIG_LV_DRAW_SW_SUPPORT_ARGB8888=y
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y
CONFIG_DISPLAY_COLOR_PALETTE=n
# LV_DRAW_TRANSFORM_USE_MATRIX + LV_Z_FULL_REFRESH were tried for
# LVGL-side screen rotation (lv_display_set_matrix_rotation()) and
# reverted: LV_DISPLAY_RENDER_MODE_FULL makes lv_inv_area() (lv_refr.c)
# return before ever firing LV_EVENT_INVALIDATE_AREA - the event
# lvgl_rounder_cb_mono() is registered on - which silently disables
# the SCREEN_INFO_X_ALIGNMENT_WIDTH/MONO_VTILED byte-rounding fixes
# that fixed everything earlier this session. Rotation is instead
# handled at the devicetree level (width/height swapped + `rotation`
# property on the ssd1683 node, see lvgl-display-ssd1683.dtsi), which
# keeps the whole PARTIAL render-mode pipeline unchanged.
# CONFIG_LV_USE_MATRIX=y
# CONFIG_LV_DRAW_TRANSFORM_USE_MATRIX=y
# CONFIG_LV_Z_FULL_REFRESH=y