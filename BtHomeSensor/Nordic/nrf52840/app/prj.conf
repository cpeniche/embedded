CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="BTHome"
CONFIG_CPP=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_GPIO=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_MAIN_STACK_SIZE=4096

# LVGL - minimal build, only the label widget enabled
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_CONF_MINIMAL=y 
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_Z_MEM_POOL_SIZE=24000
# Render the whole 300x400 screen in a single buffer/flush instead of
# chunking into multiple VDB-sized bands (the default 10%). Bands
# beyond the first have been observed to get the wrong, byte-rounded
# width from LVGL's chunk-splitting path even though the equivalent
# single-region write is correct - going single-shot sidesteps that
# entirely. 300*400/8 + 8 = 15008 bytes; MEM_POOL_SIZE bumped above to
# fit it plus headroom for other LVGL allocations.
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
CONFIG_LV_FONT_MONTSERRAT_36=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_36=y
CONFIG_DISPLAY_COLOR_PALETTE=n


#CONFIG_KERNEL_LOG_LEVEL_DBG=y
CONFIG_THREAD_NAME=y
CONFIG_USB_DEVICE_STACK_NEXT=n