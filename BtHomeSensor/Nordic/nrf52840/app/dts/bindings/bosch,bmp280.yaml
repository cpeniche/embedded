description: |
  Bosch BMP280 pressure and temperature sensor accessed through I2C bus

compatible: "bosch,bmp280"

include: [i2c-device.yaml, sensor-device.yaml]

properties:
  osrs-p:
    type: int
    required: true
    description: Default pressure oversampling rate. Only the following values are

  osrs-t:
    type: int
    required: true
    description: Default pressure oversampling rate.

  mode:
    type: int
    required: true
    description: Power Modes

  filter:
    type: int
    required: true
    description: Filter settings
